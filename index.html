<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oddwright</title><meta name="color-scheme" content="dark"><style>
:root{--bg:#0C0D10;--s1:#15171C;--line:#2A2E37;--t1:#F4F1EC;--t2:#A6ABB5;--a1:#FF5A1F;--a2:#FFA23A}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--t1);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 22px 80px}a{color:var(--a2)}h1{font-size:34px;line-height:1.15;margin:.2em 0 .1em;letter-spacing:-.01em}
h2{font-size:21px;margin:2em 0 .4em;padding-top:.6em;border-top:1px solid var(--line)}h3{font-size:17px;margin:1.4em 0 .3em}
p,li{color:#D9D6D0}small,.muted{color:var(--t2)}ul{padding-left:1.2em}li{margin:.25em 0}
.brand{display:flex;gap:10px;align-items:center;color:var(--t2);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;text-decoration:none}
.brand b{color:var(--t1)}.pill{display:inline-block;background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--t2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:18px 0}
nav.links{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{color:var(--t2);font-weight:600}
</style></head>
<body><main><a class="brand" href="/">Oddwright</a>
<h1>Oddwright</h1>
<p class="muted">An independent studio making thoughtful apps.</p>
<div class="card"><h3 style="margin-top:0">Ironhewn</h3><p>A strength-training log with metal ranks for every lift, an AI coach that reads your training, and progress you can see.</p><p><a href="/ironhewn/">Learn more</a></p></div>
<p class="muted">Contact: <a href="mailto:oddwright.support@gmail.com">oddwright.support@gmail.com</a></p>

</main></body></html>
